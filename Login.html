<!DOCTYPE html>
<html>
	<head>
		<title>CS430 Final Project Login</title>
		<meta charset = "utf-8" />
		<link rel="stylesheet" href="LoginStyles.css" type="text/css">
	</head>
	
	<body>
		<div class="login-div">
			<div class="login-section-div">
				<h2 style="padding: 0px 0px 30px 0px;">Login</h2>
				<form id="loginForm">
				<div class="input-section">
					<div class="input-div">
						<label for="username" class="login-label">Username:</label>
					</div>
					<div class="input-div">
						<input type="text" id="username" name="username">
					</div>
				</div>
				
				<div class="input-section">
					<div class="input-div">
						<label for="password" class="login-label">Password:</label>
					</div>
					<div class="input-div">
						<input type="password" id="password" name="password">
					</div>
				</div>
				
				<div class="submit-button-section">
				<input type="submit" value="Submit" class="sign-in-button">
				</div>
				</form>
			</div>
		</div>
		<script src="login.js"></script>
	</body>
</html>
