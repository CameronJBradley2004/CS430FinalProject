<!DOCTYPE html>
<html>
	<head>
		<title>CS430 Final Project Dashboard</title>
		<meta charset = "utf-8" />
		<link rel="stylesheet" href="CS430DashboardStyles.css" type="text/css">
	</head>
	<body>
	<script src="https://cdn.plot.ly/plotly-3.3.0.min.js" charset="utf-8"></script>
		<!-- Profile Banner -->
		<div class="profile-banner">
			<!-- Left side of profile banner -->
			<div class="profile-banner-left">
				<div class="profile-container">
					<img class="profile-pic" id="profilePic" src="Profile-icon.png" alt="Profile Icon"> 

					<div class="dropdown" id="dropdownMenu">
						<a href="#">Logout</a>
					</div>
				</div>
			</div>
			
			<!-- Right side of profile banner -->
			<div class="profile-banner-right">
				 <button type="button" class="add-entry-button">+ Add Entry</button> 
			</div>
		</div>
		
		<!-- Graphs Box -->
		<div class="graphs-box">
			<!-- Top graphs box -->
			<div class="graphs-box-inline">
				<div class="graph" id="graphDiv1"></div>
				<div class="graph" id="graphDiv2"></div>
			</div>
			
			<!-- Bottom graphs box -->
			<div class="graphs-box-inline">
				<div class="graph" id="graphDiv3"></div>
				<div class="graph" id="graphDiv4"></div>
			</div>
		</div>
		
		<!-- Crew AI Banner -->
		<div class="crewai-banner">
			<!-- Crew AI Banner Left -->
			<div class="crewai-banner-left">
				<!-- Crew AI Image -->
				<div class="crewai-banner-image">
					<img src="CrewAI-image.png" alt="CrewAI Helper Logo">
					<h3>AI Helper</h3>
				</div>
			</div>
			
			<!-- Crew AI Message -->
			<div class="crewai-banner-message">
			</div>
		</div>
		<script src="dashboard.js"></script>
	</body>
</html>
